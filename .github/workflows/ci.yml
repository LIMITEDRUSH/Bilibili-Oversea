name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run check
      - run: npm run package:browser
      - name: Verify versioned browser package
        run: node -e "const fs=require('fs');const v=require('./browser-extension/manifest.json').version;const p='browser-extension/dist/bilibili-oversea-browser-v'+v+'.zip';if(!fs.statSync(p).size)process.exit(1)"
      - run: npm run build -- --base-url=https://raw.githubusercontent.com/LIMITEDRUSH/Bilibili-Oversea/main --out=.ci-dist
      - run: test -f .ci-dist/index.html
      - run: test -f .ci-dist/guide.html
      - run: test -f .ci-dist/browser-guide.html
      - run: test -s .ci-dist/BiliCDNAuto-ConnectVPN.shortcut
