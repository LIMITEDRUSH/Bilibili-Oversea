<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bilibili-oversea</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="brand"><img src="../assets/icons/icon-48.png" alt=""><div><h1>Bilibili-oversea</h1><p>独立实现 · 本地测速</p></div></div>
      <label class="switch" title="启用扩展"><input id="enabled" type="checkbox"><span></span></label>
    </header>

    <section class="status-card">
      <div class="status-line"><span id="dot" class="dot"></span><strong id="phase">等待视频</strong></div>
      <code id="selected">尚未选择 CDN</code>
      <p id="message">打开 B 站视频并播放几秒。</p>
    </section>

    <section class="controls" aria-label="运行模式">
      <button id="auto" type="button">自动优选</button>
      <button id="retest" type="button" class="secondary">重新测速</button>
      <button id="original" type="button" class="secondary">原始 CDN</button>
    </section>

    <section>
      <div class="section-title"><h2>测速结果</h2><span id="testedAt"></span></div>
      <div id="results" class="results"><p class="empty">尚无结果</p></div>
    </section>

    <section class="settings">
      <label for="refresh">自动重测</label>
      <select id="refresh">
        <option value="0">关闭</option>
        <option value="15">15 分钟</option>
        <option value="30">30 分钟</option>
        <option value="60">60 分钟</option>
      </select>
    </section>

    <footer><a href="https://limitedrush.github.io/Bilibili-Oversea/browser-guide.html" target="_blank" rel="noreferrer">安装与使用教程</a><span>v2.0.2</span></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
