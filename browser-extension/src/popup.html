<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Bilibili-oversea</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon"><img src="../assets/icons/icon-48.png" alt=""></span>
        <h1>Bilibili <span>oversea</span></h1>
      </div>
      <label class="power-switch" title="启用线路优化">
        <span class="sr-only">启用线路优化</span>
        <input id="enabled" type="checkbox">
        <span class="power-track" aria-hidden="true"><span></span></span>
      </label>
    </header>

    <section id="statusPanel" class="status-panel" data-playback="unknown" aria-label="当前视频">
      <div class="status-head">
        <div class="playback-heading" role="status" aria-live="polite">
          <span id="dot" class="dot" aria-hidden="true"></span>
          <strong id="playbackStatus">读取播放状态</strong>
        </div>
        <span id="routeMode" class="mode-chip">自动选路</span>
      </div>
      <h2 id="videoTitle" title="">未读取到视频标题</h2>
      <div class="video-stats">
        <div><span class="stat-label">分辨率</span><strong id="resolution">—</strong></div>
        <div><span class="stat-label">缓冲</span><strong id="buffer">—</strong></div>
        <div class="progress-stat"><span class="stat-label">播放进度</span><strong id="progress">--:-- / --:--</strong></div>
      </div>
      <div class="route-detail">
        <span>当前线路</span><strong id="actual" title="">尚未观察</strong>
        <span id="applyState" class="state-chip">等待请求</span>
      </div>
      <div id="pendingRoute" class="pending-route" hidden><span>目标线路</span><strong id="selected"></strong></div>
      <div id="routingActivity" class="routing-activity" hidden role="status"><span class="spinner" aria-hidden="true"></span><span id="phase"></span></div>
      <p id="message" class="notice" hidden role="status"></p>
    </section>

    <section class="strategy-section" aria-label="播放策略">
      <div class="mode-control" role="group" aria-label="播放策略">
        <button id="auto" type="button" aria-pressed="true">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10a6 6 0 0 1 10.6-3.8M16 10a6 6 0 0 1-10.6 3.8M14.6 3.8v3.1h-3.1M5.4 16.2v-3.1h3.1"/></svg>
          <span>自动</span>
        </button>
        <button id="original" type="button" aria-pressed="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 10h13M10 3.5v13"/></svg>
          <span>原始线路</span>
        </button>
      </div>
      <button id="retest" class="retest-button" type="button" title="重测线路（R）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 6.4A6.3 6.3 0 1 0 16 13M15.5 6.4V2.8M15.5 6.4h-3.6"/></svg>
        <span>重测</span>
      </button>
    </section>

    <section class="results-section" aria-labelledby="resultsTitle">
      <div class="section-title">
        <h2 id="resultsTitle">节点</h2>
        <span id="resultSummary">0 个</span>
      </div>
      <div id="results" class="results" tabindex="0" aria-label="全部候选节点，可滚动"><p class="empty">尚未测速</p></div>
      <span id="testedAt" class="tested-time"></span>
    </section>

    <footer>
      <a href="https://limitedrush.online/projects/bilibili-oversea" target="_blank" rel="noreferrer">项目与帮助 <span aria-hidden="true">↗</span></a>
      <button id="copyDiagnostics" type="button">复制诊断</button>
      <span id="version">v—</span>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
